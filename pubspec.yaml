name: media_archive
description: Media Archive - catalogo di film e serie TV con integrazione TMDB.
publish_to: "none"
version: 1.12.5+17

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  intl: ^0.20.2
  uuid: ^4.5.1
  csv: ^6.0.0
  xml: ^6.5.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  mobile_scanner: ^5.2.3
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/media_archive_logo.png
